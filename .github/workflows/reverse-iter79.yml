name: Reverse iter79 (Production)

# Manual-trigger workflow para ejecutar el reverso de iter79 contra la DB de
# producción. SIEMPRE genera backup primero, luego dry-run, y solo aplica si
# `apply` se marca explícitamente como true.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '¿Aplicar el reverso real? (false = solo backup + dry-run)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      confirmation:
        description: 'Escribe "YES_REVERSE_ITER79" para confirmar (solo si apply=true)'
        required: false
        type: string

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate confirmation if applying
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "YES_REVERSE_ITER79" ]; then
            echo "❌ Para apply=true, debes escribir YES_REVERSE_ITER79 en confirmation."
            exit 1
          fi
          echo "✓ Confirmación válida. Procediendo con apply real."

      - name: Install MongoDB tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [arch=amd64,arm64] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-database-tools mongodb-mongosh
          mongosh --version
          mongodump --version | head -1

      - name: Set timestamp env
        run: echo "TS=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Backup (mongodump) — OBLIGATORIO
        env:
          MONGO_URL: ${{ secrets.PROD_MONGO_URL }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          set -e
          if [ -z "$MONGO_URL" ] || [ -z "$DB_NAME" ]; then
            echo "❌ Faltan secrets: PROD_MONGO_URL o PROD_DB_NAME"
            exit 1
          fi
          BACKUP_DIR="$RUNNER_TEMP/backup_$TS"
          mkdir -p "$BACKUP_DIR"
          for col in journeys packages incidents; do
            echo "→ Dumping $col ..."
            mongodump --uri="$MONGO_URL" --db="$DB_NAME" --collection="$col" --out="$BACKUP_DIR" --quiet
          done
          ls -la "$BACKUP_DIR/$DB_NAME"
          echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_ENV

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TS }}
          path: ${{ env.BACKUP_DIR }}
          retention-days: 90

      - name: Run dry-run diagnóstico
        env:
          MONGO_URL: ${{ secrets.PROD_MONGO_URL }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          mongosh "$MONGO_URL/$DB_NAME" --quiet --file memory/recovery_scripts/01_DRY_RUN_DIAGNOSTICO.js 2>&1 | tee dry_run.log

      - name: Upload dry-run log
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ env.TS }}
          path: dry_run.log
          retention-days: 90

      - name: Run apply (escrituras reales)
        if: ${{ github.event.inputs.apply == 'true' }}
        env:
          MONGO_URL: ${{ secrets.PROD_MONGO_URL }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          echo "⚠️  APPLY REAL en marcha (con apply=true)"
          mongosh "$MONGO_URL/$DB_NAME" --quiet --file memory/recovery_scripts/02_APPLY_REVERSE.js 2>&1 | tee apply.log

      - name: Upload apply log
        if: ${{ github.event.inputs.apply == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: apply-${{ env.TS }}
          path: apply.log
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Reverse iter79 — Resultado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo:** ${{ github.event.inputs.apply == 'true' && 'APPLY REAL' || 'DRY-RUN ONLY' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $TS" >> $GITHUB_STEP_SUMMARY
          echo "- **Artefactos generados:** db-backup-$TS, dry-run-$TS${{ github.event.inputs.apply == 'true' && format(', apply-{0}', env.TS) || '' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para restaurar desde backup:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "mongorestore --uri=\"\$MONGO_URL\" --drop /path/to/db-backup-$TS/$DB_NAME" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
