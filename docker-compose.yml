version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mye-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mye-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: myexcellence
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-Admin123!}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-no-reply@myexcellence.local}
      ROUTAL_API_KEY: ${ROUTAL_API_KEY:-}
      ROUTAL_PROJECT_ID: ${ROUTAL_PROJECT_ID:-}
      ROUTAL_BASE_URL: ${ROUTAL_BASE_URL:-https://api.routal.com}
      CRON_ENABLED: ${CRON_ENABLED:-1}
      EVIDENCE_ROOT: /app/data/evidences
    volumes:
      - evidence_data:/app/data/evidences
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: mye-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  evidence_data:
